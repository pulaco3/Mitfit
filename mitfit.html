<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#0a0d0a;
    --surface:#111611;
    --surface-2:#171d17;
    --line:#263025;
    --text:#eef3ee;
    --text-dim:#8b988c;
    --red:#d62839;
    --accent:#22e07a;
    --accent-dark:#157a41;
    --danger:#e5484d;
    --blue:#2f6fd6;
    --yellow:#f4a700;
    --green:#4f9d69;
    --white-plate:#eceae4;
    --font-display:'Oswald', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
  }
  body{
    min-height:100vh;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:14px 14px;
  }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:24px; }

  h1,h2,h3{ font-family:var(--font-display); font-weight:600; letter-spacing:0.02em; margin:0; }
  .mono{ font-family:var(--font-mono); }

  /* Top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px; border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .plate-mini{ width:26px; height:26px; border-radius:50%; background:var(--accent); border:3px solid var(--accent-dark); }
  .brand-logo{ width:28px; height:28px; border-radius:50%; object-fit:cover; border:2px solid var(--line); flex-shrink:0; }
  .brand h1{ font-size:20px; letter-spacing:0.12em; }
  .backlink, .switchlink{
    font-family:var(--font-mono); font-size:12px; color:var(--text-dim);
    background:none; border:none; cursor:pointer; padding:6px 0;
  }
  .backlink{ display:flex; align-items:center; gap:6px; }

  .content{ flex:1; padding:20px 20px 110px; }
  .content.with-bottom-nav{ padding-bottom:150px; }

  .bottom-nav{
    position:fixed; left:50%; bottom:0; transform:translateX(-50%);
    width:100%; max-width:480px; background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:8px 0 max(8px, env(safe-area-inset-bottom)); z-index:55;
  }
  .bottom-nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; cursor:pointer; padding:6px 0; color:var(--text-dim);
    font-family:var(--font-body); font-size:11px;
  }
  .bottom-nav-icon{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .bottom-nav-item.active{ color:var(--accent); }
  .bottom-nav-item.active .bottom-nav-icon{ background:var(--accent); color:#06210f; }

  /* Buttons */
  .btn{
    font-family:var(--font-display); font-weight:600; letter-spacing:0.04em;
    font-size:15px; text-transform:uppercase; border:none; border-radius:10px;
    padding:16px 18px; cursor:pointer; width:100%; text-align:center;
  }
  .btn-primary{ background:var(--accent); color:#06210f; }
  .btn-secondary{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); }
  .btn-ghost{ background:transparent; color:var(--text-dim); border:1px dashed var(--line); }
  .btn-sm{ padding:10px 14px; font-size:12px; width:auto; border-radius:8px; }
  .btn:active{ transform:scale(0.98); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); }

  .stack{ display:flex; flex-direction:column; gap:12px; }
  .row-gap{ display:flex; gap:10px; }

  /* Home */
  .hero{ text-align:center; padding:36px 8px 28px; }
  .hero .eyebrow{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); letter-spacing:0.2em; text-transform:uppercase; }
  .hero h2{ font-size:40px; margin:8px 0 6px; letter-spacing:0.03em; }
  .hero p{ color:var(--text-dim); font-size:14px; margin:0; }
  .plate-stack{ display:flex; justify-content:center; gap:6px; margin:22px 0 30px; }
  .plate-stack .p{ width:14px; height:44px; border-radius:3px; }
  .hero-logo{
    width:100%; max-width:320px; border-radius:14px; margin:18px auto 14px;
    display:block; border:1px solid var(--line); box-shadow:0 14px 34px rgba(0,0,0,0.45);
  }

  .role-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:12px; cursor:pointer;
  }
  .role-card h3{ font-size:17px; margin-bottom:4px; }
  .role-card p{ color:var(--text-dim); font-size:13px; margin:0; }

  /* Plate avatar */
  .plate{
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; flex-shrink:0;
    border-style:solid;
  }
  .plate-text-dark{ color:#1c1c1e; }
  .plate-text-light{ color:#fff; }

  /* Student list */
  .student-card{
    display:flex; align-items:center; gap:14px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:14px; cursor:pointer;
  }
  .student-card .info{ flex:1; min-width:0; }
  .student-card .info h3{ font-size:15px; font-weight:600; font-family:var(--font-body); }
  .student-card .info p{ margin:2px 0 0; font-size:12px; color:var(--text-dim); font-family:var(--font-mono); }
  .student-card .chev{ color:var(--text-dim); font-size:18px; }

  .empty{ text-align:center; padding:40px 16px; color:var(--text-dim); }
  .empty p{ font-size:13px; margin:0 0 16px; }

  .section-title{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--text-dim); margin:22px 0 10px;
  }
  .section-title:first-child{ margin-top:0; }

  /* Tabs */
  .tabs{ display:flex; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .tab{
    flex:1; text-align:center; padding:10px 6px; font-family:var(--font-display);
    font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);
    background:none; border:none; border-bottom:2px solid transparent; cursor:pointer;
  }
  .tab.active{ color:var(--text); border-bottom-color:var(--accent); }

  /* Exercise row (trainer) */
  .ex-row{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px;
  }
  .ex-row .ex-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .ex-row h4{ font-size:15px; font-family:var(--font-body); font-weight:600; margin:0; }
  .ex-row .meta{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:4px; }
  .icon-btn{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:15px; padding:4px 6px; }
  .icon-btn.danger{ color:var(--danger); }

  /* Exercise photos */
  .ex-photo{ width:88px; height:88px; border-radius:12px; object-fit:cover; flex-shrink:0; border:1px solid var(--line); background:var(--surface-2); }
  .ex-photo-placeholder{ width:88px; height:88px; border-radius:12px; background:var(--surface-2); border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:30px; flex-shrink:0; color:var(--text-dim); }
  .photo-input-wrap{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .photo-input-wrap label.upload-btn{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); cursor:pointer; display:inline-block; position:relative; }
  .photo-input-wrap input[type=file]{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; white-space:nowrap; border:0; opacity:0;
  }
  .photo-remove{ background:none; border:none; color:var(--danger); font-family:var(--font-mono); font-size:11px; cursor:pointer; text-align:left; padding:0; }

  /* Inline form */
  .inline-form{
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:10px;
  }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.08em; }
  .field input{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px;
    padding:11px 12px; color:var(--text); font-family:var(--font-body); font-size:14px;
  }
  .field textarea{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px;
    padding:11px 12px; color:var(--text); font-family:var(--font-body); font-size:14px;
    resize:vertical; min-height:90px; line-height:1.4;
  }
  .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field input:focus{ outline:none; border-color:var(--accent); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }

  /* Barbell / set loader */
  .bar-loader{ display:flex; align-items:center; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:2px; }
  .bar-line{ height:4px; width:14px; background:var(--line); border-radius:2px; flex-shrink:0; }
  .slot{
    width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:9px; font-weight:700; border:2px dashed var(--line); color:var(--text-dim);
    cursor:pointer; text-align:center; line-height:1.1; position:relative;
  }
  .slot.filled{ border-style:solid; }
  .slot-check{
    position:absolute; top:-5px; right:-5px; width:15px; height:15px; border-radius:50%;
    background:var(--green); color:#fff; font-size:9px; font-weight:700; display:flex;
    align-items:center; justify-content:center; border:2px solid var(--bg); line-height:1;
  }
  .ex-complete-badge{
    display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;
    border-radius:50%; background:var(--green); color:#fff; font-size:10px; margin-left:6px; vertical-align:middle;
  }

  /* Session summary / logs */
  .session-item{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .session-item .date{ font-family:var(--font-mono); font-size:12px; color:var(--yellow); margin-bottom:6px; }
  .session-item .line{ font-size:13px; color:var(--text); margin:2px 0; }
  .session-item .line span{ color:var(--text-dim); }

  /* Chart */
  .chart-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .chart-card h4{ font-family:var(--font-body); font-size:14px; font-weight:600; margin:0 0 10px; }
  svg.chart{ width:100%; height:auto; display:block; }
  .chart-empty{ color:var(--text-dim); font-size:12px; font-family:var(--font-mono); text-align:center; padding:14px 0; }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-family:var(--font-mono); font-size:12px; padding:10px 18px; border-radius:20px;
    box-shadow:0 6px 20px rgba(0,0,0,0.4); opacity:0; pointer-events:none; transition:opacity 0.25s ease;
    z-index:70; white-space:nowrap;
  }
  .toast.show{ opacity:1; }

  .divider{ height:1px; background:var(--line); margin:22px 0; }

  /* Superset block */
  .superset-block{ border-left:3px solid var(--accent); padding-left:12px; margin-bottom:12px; }
  .superset-badge{
    display:inline-block; font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; padding:3px 9px; border-radius:20px; margin-bottom:8px;
  }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin:-2px 0 12px; }
  .chip{
    font-family:var(--font-mono); font-size:11px; background:var(--bg); color:var(--text-dim);
    border:1px solid var(--line); border-radius:20px; padding:5px 11px; cursor:pointer;
  }
  .chip-active{ background:var(--accent); border-color:var(--accent-dark); color:#06210f; }
  .browse-row{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; cursor:pointer; margin-bottom:8px;
  }
  .browse-row.browse-selected{ border-color:var(--accent); background:var(--surface-2); }
  .browse-row .thumb{ width:40px; height:40px; border-radius:8px; flex-shrink:0; }
  .browse-row .info{ flex:1; min-width:0; }
  .browse-row .info .bname{ font-size:14px; font-weight:600; color:var(--text); font-family:var(--font-body); }
  .browse-row .info .bgroup{ font-size:11px; font-family:var(--font-mono); color:var(--text-dim); margin-top:2px; }
  .browse-row .check{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent;
  }
  .browse-row.browse-selected .check{ background:var(--accent); border-color:var(--accent); color:#06210f; }

  /* Rest timer bar */
  .rest-timer-bar{
    position:fixed; left:50%; bottom:78px; transform:translateX(-50%);
    width:calc(100% - 32px); max-width:448px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
    padding:12px 16px; display:none; align-items:center; gap:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5); z-index:60;
  }
  .rest-timer-bar.show{ display:flex; }
  .rt-ring-wrap{ position:relative; width:56px; height:56px; flex-shrink:0; }
  .rt-ring{ width:56px; height:56px; transform:rotate(-90deg); }
  .rt-ring-bg{ fill:none; stroke:var(--line); stroke-width:5; }
  .rt-ring-fg{ fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round; stroke-dasharray:163.36; stroke-dashoffset:0; transition:stroke-dashoffset 0.9s linear; }
  .rt-time{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; font-weight:700; }
  .rt-info{ flex:1; min-width:0; }
  .rt-label{ font-family:var(--font-body); font-size:13px; font-weight:600; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rt-controls{ display:flex; gap:6px; }
  .rt-controls button{ background:var(--bg); border:1px solid var(--line); color:var(--text); font-family:var(--font-mono); font-size:11px; border-radius:6px; padding:6px 9px; cursor:pointer; }

  /* Session clock bar */
  .session-clock-bar{
    position:fixed; top:12px; left:50%; transform:translateX(-50%);
    width:calc(100% - 32px); max-width:448px;
    background:var(--surface-2); border:1px solid var(--accent); border-radius:14px;
    padding:10px 14px; display:none; align-items:center; gap:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5); z-index:65;
  }
  .session-clock-bar.show{ display:flex; }
  .session-clock-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; animation:pulseDot 1.4s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
  .session-clock-label{ font-family:var(--font-body); font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .session-clock-time{ font-family:var(--font-mono); font-size:16px; font-weight:700; color:var(--accent); flex-shrink:0; }
  .session-clock-cancel{ background:none; border:none; color:var(--text-dim); font-size:14px; cursor:pointer; padding:2px 4px; flex-shrink:0; }

  /* Celebration overlay */
  @keyframes popIn{
    0%{ transform:scale(0.7); opacity:0; }
    60%{ transform:scale(1.06); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  @keyframes confettiFall{
    0%{ transform:translateY(-10px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(260px) rotate(420deg); opacity:0; }
  }
  @keyframes iconBounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }
  .celebration-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.78); display:none; align-items:center; justify-content:center;
    z-index:80; padding:24px;
  }
  .celebration-overlay.show{ display:flex; }
  #confirmOverlay{ z-index:95; }
  .celebration-card{
    background:var(--surface); border:1px solid var(--accent); border-radius:18px; padding:34px 24px 26px;
    text-align:center; max-width:320px; width:100%; position:relative; overflow:hidden;
    animation:popIn 0.4s ease-out; box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .celebration-icon{ font-size:52px; margin-bottom:10px; display:block; animation:iconBounce 1.1s ease-in-out infinite; }
  .celebration-phrase{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--text); line-height:1.3; margin-bottom:14px; }
  .celebration-stats{ font-family:var(--font-mono); font-size:12px; color:var(--accent); margin-bottom:20px; }
  .celebration-close{
    background:var(--accent); color:#06210f; border:none; border-radius:10px; padding:11px 22px;
    font-family:var(--font-display); font-weight:600; font-size:13px; letter-spacing:0.04em;
    text-transform:uppercase; cursor:pointer;
  }
  .confetti-piece{ position:absolute; top:-10px; width:8px; height:8px; border-radius:2px; animation:confettiFall linear forwards; pointer-events:none; }

  /* Tabata overlay */
  .tabata-overlay{
    position:fixed; inset:0; background:rgba(6,8,6,0.90); display:none; flex-direction:column;
    align-items:center; justify-content:center; z-index:90; padding:24px; text-align:center;
    overflow:hidden;
  }
  .tabata-overlay.show{ display:flex; }
  .tabata-bg-logo{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:75%; max-width:340px; opacity:0.14; pointer-events:none; filter:grayscale(1);
  }
  .tabata-close{ position:absolute; top:18px; right:18px; background:none; border:none; color:var(--text-dim); font-size:24px; cursor:pointer; padding:6px; }
  .tabata-phase{ font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px; }
  .tabata-phase.work{ color:var(--accent); }
  .tabata-phase.rest{ color:var(--yellow); }
  .tabata-phase.prep{ color:var(--text-dim); }
  .tabata-phase.done{ color:var(--green); }
  .tabata-time{ font-family:var(--font-display); font-size:84px; font-weight:700; line-height:1; margin-bottom:14px; }
  .tabata-time.work{ color:var(--accent); }
  .tabata-time.rest{ color:var(--yellow); }
  .tabata-time.prep{ color:var(--text-dim); }
  .tabata-time.done{ color:var(--green); }
  .tabata-exname{ font-family:var(--font-body); font-size:21px; font-weight:600; margin-bottom:8px; max-width:320px; color:var(--text); }
  .tabata-round{ font-family:var(--font-mono); font-size:13px; color:var(--text-dim); margin-bottom:32px; }
  .tabata-controls{ display:flex; gap:12px; }
  .tabata-controls button{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:10px;
    padding:13px 20px; font-family:var(--font-mono); font-size:13px; cursor:pointer;
  }
  .tabata-heart-wave{ width:100%; max-width:300px; height:46px; margin:0 auto 16px; overflow:hidden; opacity:0.9; }
  .tabata-heart-wave svg{ width:200%; height:100%; display:block; animation-name:tabataHeartScroll; animation-timing-function:linear; animation-iteration-count:infinite; animation-duration:1.4s; }
  .tabata-heart-wave .wave-path{ fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke:var(--text-dim); }
  .tabata-heart-wave .wave-g{ transform-box:fill-box; transform-origin:center; transition:transform 0.4s ease; transform:scaleY(0.1); }
  .tabata-heart-wave.work .wave-g{ transform:scaleY(1); }
  .tabata-heart-wave.work svg{ animation-duration:0.65s; }

function normalizeStr(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function handleCatalogSearch(ev, resultsId){
  const box = document.getElementById(resultsId || 'exCatalogResults');
  if(!box) return;
  const q = normalizeStr(ev.target.value.trim());
  if(!q){ box.innerHTML = ''; return; }
  const nameMatches = EXERCISE_CATALOG.filter(e => normalizeStr(e.name).includes(q));
  const groupMatches = EXERCISE_CATALOG.filter(e => normalizeStr(e.group).includes(q) && !normalizeStr(e.name).includes(q));
  const matches = [...nameMatches, ...groupMatches].slice(0, 40);
  if(!matches.length){ box.innerHTML = '<div style="font-family:var(--font-mono); font-size:11px; color:var(--text-dim); padding:4px 0;">Sin resultados — puedes escribir el nombre libremente.</div>'; return; }
  box.innerHTML = matches.map(e =>
    `<button type="button" class="chip" onclick="selectCatalogExercise('${e.name.replace(/'/g,"\\'")}', '${e.group.replace(/'/g,"\\'")}', '${e.type === 'time' ? 'time' : 'reps'}')">${escapeHtml(e.name)}</button>`
  ).join('');
}
function selectCatalogExercise(name, group, type){
  const nameInput = document.getElementById('exName');
  if(nameInput) nameInput.value = name;
  ['exCatalogSearchExercise','exCatalogSearchBottom'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.value = '';
  });
  ['exCatalogResultsExercise','exCatalogResultsBottom'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.innerHTML = '';
  });
  const urlInput = document.getElementById('exPhotoUrl');
  if(urlInput && !urlInput.value.trim()){
    const autoUrl = groupPlaceholderDataUrl(group);
    urlInput.value = autoUrl;

  if(nameInput) nameInput.focus();
}

  {bg:'#22e07a', border:'#157a41', text:'dark'},
  {bg:'#d62839', border:'#8f1c27', text:'light'},
  {bg:'#2f6fd6', border:'#1f4b95', text:'light'},
  {bg:'#f4a700', border:'#a66f00', text:'dark'},
  {bg:'#eceae4', border:'#b8b6ae', text:'dark'},
];
function plateColorFor(index){ return PLATE_COLORS[index % PLATE_COLORS.length]; }
function hashStr(s){ let h = 0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) % 997; } return h; }
function groupColor(label){ return PLATE_COLORS[hashStr(String(label)) % PLATE_COLORS.length]; }
function buildGroupedBlocks(routine){
  const blocks = [];
  let i = 0;
  const list = routine || [];
  while(i < list.length){
    const ex = list[i];
    const label = (ex.supersetGroup || '').trim();
    if(label){
      const items = [ex];
      let j = i + 1;
      while(j < list.length && (list[j].supersetGroup || '').trim() === label){ items.push(list[j]); j++; }
      blocks.push({ group: label, items });
      i = j;
    } else {
      blocks.push({ group: null, items: [ex] });
      i++;
    }
  }
  return blocks;
}
function existingGroupLabels(routine, excludeExId){
  const set = new Set();
  (routine || []).forEach(e => {
    if(e.id === excludeExId) return;
    const l = (e.supersetGroup || '').trim();
    if(l) set.add(l);
  });
  return Array.from(set);
}
function supersetQuickPicks(existingLabels){
  const letters = ['A','B','C','D','E','F'];
  const combined = [...letters, ...existingLabels];
  return Array.from(new Set(combined));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ const d = new Date(); return d.toISOString().slice(0,10); }
function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d.getDate() + ' ' + meses[d.getMonth()];
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function youtubeSearchUrl(name){
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent((name||'ejercicio') + ' ejercicio técnica');
}
function combineMinSec(minInputId, secInputId){
  const m = parseFloat(document.getElementById(minInputId)?.value) || 0;
  const s = parseFloat(document.getElementById(secInputId)?.value) || 0;
  return m + (s / 60);
}
function splitMinSec(totalMinutes){
  const totalSec = Math.round((totalMinutes || 0) * 60);
  return { min: Math.floor(totalSec / 60), sec: totalSec % 60 };
}
function formatMinDuration(totalMinutes){
  const totalSec = Math.round((totalMinutes || 0) * 60);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  if(m === 0) return s + 's';
  if(s === 0) return m + 'min';
  return m + 'm ' + s + 's';
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.remove('show'), 1800);
}

  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms || 6000))
  ]);
}

let wakeLock = null;
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  }catch(e){ wakeLock = null; }
}

  if(document.visibilityState === 'visible') requestWakeLock();
});

  if(!entry) return;

  entry.pin = pin;

  const q = normalizeStr(ev.target.value.trim());
  if(!q){ box.innerHTML = ''; return; }
  const matches = EXERCISE_CATALOG.filter(e => normalizeStr(e.name).includes(q)).slice(0, 20);
  if(!matches.length){ box.innerHTML = '<div style="font-family:var(--font-mono); font-size:11px; color:var(--text-dim); padding:4px 0;">Sin resultados — agrégalo escribiendo el nombre abajo.</div>'; return; }
  box.innerHTML = matches.map(e =>
    `<button type="button" class="chip" onclick="addSupersetExercise('${e.name.replace(/'/g,"\\'")}', '${e.type === 'time' ? 'time' : 'reps'}', '${e.group.replace(/'/g,"\\'")}')">+ ${escapeHtml(e.name)}</button>`
  ).join('');

function nextSupersetLabel(routine){
  const used = new Set((routine || []).map(e => (e.supersetGroup||'').trim()).filter(Boolean));
  const letters = 'ABCDEFGHIJ'.split('');
  return letters.find(l => !used.has(l)) || ('G' + (used.size + 1));
}

function groupPlaceholderDataUrl(group){
  const c = groupColor(group || 'General');
  const label = escapeHtml((group || 'GYM').toUpperCase());
  const textColor = c.text === 'light' ? '#ffffff' : '#1c1c1e';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" rx="26" fill="${c.bg}"/><text x="80" y="90" font-family="monospace" font-size="17" font-weight="700" fill="${textColor}" text-anchor="middle">${label}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

async function submitExerciseForm(ev){
  ev.preventDefault();
  const name = document.getElementById('exName').value.trim();
  const type = document.getElementById('exType').value === 'time' ? 'time' : 'reps';
  const warmup = document.getElementById('exWarmup').value === 'true';
  const sets = parseInt(document.getElementById('exSets').value) || 3;
  const reps = type === 'time'
    ? (combineMinSec('exRepsMin', 'exRepsSec') || 1)
    : (parseFloat(document.getElementById('exReps').value) || 10);
  const weight = parseFloat(document.getElementById('exWeight').value) || 0;
  const restSeconds = parseInt(document.getElementById('exRest').value) || 90;
  const supersetGroup = document.getElementById('exSuperset').value.trim();
  const photo = document.getElementById('exPhotoUrl').value.trim();
  const video = document.getElementById('exVideoUrl').value.trim();
  if(!name) return;

  if(state.formOpen === 'addExercise'){
    getActiveRoutine().exercises.push({
      id: uid(), name, type, warmup, sets, reps, weight, restSeconds, supersetGroup, photo, video
    });
  } else if(state.formOpen && state.formOpen.startsWith('editExercise:')){
    const exId = state.formOpen.split(':')[1];
    const ex = activeExercises().find(e => e.id === exId);
    if(ex){
      ex.name = name; ex.type = type; ex.warmup = warmup; ex.sets = sets; ex.reps = reps; ex.weight = weight; ex.restSeconds = restSeconds;
      ex.supersetGroup = supersetGroup; ex.photo = photo; ex.video = video;
    }
  }
  await saveStudent(state.currentId, state.currentData);
  state.formOpen = null;
  showToast('Ejercicio guardado');
  render();
}

async function deleteExercise(exId){
  showConfirmDialog('¿Quitar este ejercicio de la rutina?', async () => {
    const r = getActiveRoutine();
    r.exercises = r.exercises.filter(e => e.id !== exId);
    await saveStudent(state.currentId, state.currentData);
    render();
  });
}

function getTodaysDraft(){
  if(!state.currentData.__draft) state.currentData.__draft = {};
  return state.currentData.__draft;
}
function openLogSlot(exId, slotIndex){
  state.formOpen = 'logSet:' + exId + ':' + slotIndex;
  render();
  setTimeout(()=> document.getElementById('slotReps')?.focus(), 50);
}
async function submitLogSlot(ev, exId, slotIndex){
  ev.preventDefault();
  const ex0 = activeExercises().find(e => e.id === exId);
  const isTimeEx = ex0 && ex0.type === 'time';
  const reps = isTimeEx ? combineMinSec('slotRepsMin', 'slotRepsSec') : parseFloat(document.getElementById('slotReps').value);
  const weight = parseFloat(document.getElementById('slotWeight').value);
  if(!reps || isNaN(weight)) return;
  const draft = getTodaysDraft();
  if(!draft[exId]) draft[exId] = [];
  draft[exId][slotIndex] = { reps, weight };
  state.formOpen = null;
  render();
  const routine = activeExercises();
  const ex = routine.find(e => e.id === exId);
  if(ex){
    const label = (ex.supersetGroup || '').trim();
    let shouldRest = true;
    if(label){
      const idx = routine.indexOf(ex);
      const next = routine[idx + 1];
      if(next && (next.supersetGroup || '').trim() === label){ shouldRest = false; }
    }
    if(shouldRest) startRestTimer(ex.restSeconds || 90, ex.name);
  }
}
function hasAnyDraft(){
  const draft = getTodaysDraft();
  return Object.values(draft).some(arr => (arr||[]).some(s => s));
}
async function saveSession(){
  const draft = getTodaysDraft();
  const entries = [];
  const activeRoutine = getActiveRoutine();
  activeExercises().forEach(ex => {
    const sets = (draft[ex.id] || []).filter(Boolean);
    if(sets.length){ entries.push({ exerciseId: ex.id, exerciseName: ex.name, sets }); }
  });
  if(!entries.length){ showToast('Registra al menos una serie'); return; }
  const today = todayISO();
  const photo = (state.currentData.__draftPhoto || '').trim();
  const durationSeconds = isWorkoutClockActive() ? stopWorkoutClock() : 0;
  const routineId = activeRoutine ? activeRoutine.id : null;
  const routineName = activeRoutine ? activeRoutine.name : '';
  state.currentData.logs = state.currentData.logs || [];
  const existingIdx = state.currentData.logs.findIndex(l => l.date === today && l.routineId === routineId);
  const logEntry = { date: today, entries, photo, durationSeconds, routineId, routineName };
  if(existingIdx >= 0){ state.currentData.logs[existingIdx] = logEntry; }
  else{ state.currentData.logs.push(logEntry); }
  state.currentData.__draft = {};
  state.currentData.__draftPhoto = '';
  await saveStudent(state.currentId, state.currentData);
  const volume = computeSessionVolume({ date: today, entries }, state.currentData);
  const durationText = durationSeconds ? ' · ' + formatDuration(durationSeconds) : '';
  showToast('Sesión guardada — ' + volume.toLocaleString('es-AR') + ' kg totales' + durationText);
  render();
  const statsText = volume.toLocaleString('es-AR') + ' kg totales' + durationText;
  showCompletionCelebration(statsText);
}

/* ---------- Rest timer ---------- */
let timerInterval = null;
let timerState = { remaining:0, total:0, running:false, label:'', endTime:0 };
const RING_CIRCUMFERENCE = 163.36;

function requestNotifPermission(){
  try{
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
  }catch(e){}
}

function startRestTimer(seconds, label){
  seconds = Math.max(5, seconds || 90);
  clearInterval(timerInterval);
  timerState = { remaining: seconds, total: seconds, running: true, label: label || 'Descanso', endTime: Date.now() + seconds*1000 };
  const bar = document.getElementById('restTimerBar');
  if(bar) bar.classList.add('show');
  updateTimerBarUI();
  timerInterval = setInterval(tickTimer, 250);
  requestNotifPermission();
}
function tickTimer(){
  if(!timerState.running) return;
  const remaining = Math.max(0, Math.round((timerState.endTime - Date.now())/1000));
  timerState.remaining = remaining;
  if(remaining <= 0){
    updateTimerBarUI();
    clearInterval(timerInterval);
    timerState.running = false;
    onRestTimerFinished();
    return;
  }
  updateTimerBarUI();
}
function onRestTimerFinished(){
  beep();
  if(navigator.vibrate) navigator.vibrate([300,150,300,150,300,150,500]);
  showToast('¡Descanso terminado!');
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification('MITFIT · Descanso terminado', {
        body: timerState.label ? ('Volvé a: ' + timerState.label) : 'Es hora de continuar',
        tag: 'mitfit-rest'
      });
    }
  }catch(e){}
  setTimeout(closeTimer, 2500);
}
// Si la app estuvo en segundo plano y el descanso ya terminó, lo detecta apenas volvés
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && timerState.running){
    tickTimer();
  }
});
function updateTimerBarUI(){
  const mm = String(Math.floor(timerState.remaining/60)).padStart(2,'0');
  const ss = String(timerState.remaining%60).padStart(2,'0');
  const timeEl = document.getElementById('rtTime'); if(timeEl) timeEl.textContent = mm+':'+ss;
  const labelEl = document.getElementById('rtLabel'); if(labelEl) labelEl.textContent = timerState.label;
  const frac = timerState.total ? timerState.remaining/timerState.total : 0;
  const ring = document.getElementById('rtRingProgress');
  if(ring) ring.style.strokeDashoffset = (RING_CIRCUMFERENCE * (1-frac)).toFixed(1);
  const toggleBtn = document.getElementById('rtToggleBtn'); if(toggleBtn) toggleBtn.textContent = timerState.running ? '⏸' : '▶';
}
function toggleTimerPause(){
  timerState.running = !timerState.running;
  if(timerState.running){
    timerState.endTime = Date.now() + timerState.remaining*1000;
    timerInterval = setInterval(tickTimer, 250);
  }else{
    clearInterval(timerInterval);
  }
  updateTimerBarUI();
}
function adjustTimer(delta){
  timerState.remaining = Math.max(0, timerState.remaining + delta);
  if(timerState.remaining > timerState.total) timerState.total = timerState.remaining;
  timerState.endTime = Date.now() + timerState.remaining*1000;
  updateTimerBarUI();
}
function closeTimer(){
  clearInterval(timerInterval);
  timerState = { remaining:0, total:0, running:false, label:'', endTime:0 };
  const bar = document.getElementById('restTimerBar');
  if(bar) bar.classList.remove('show');
}
function boxingBell(strikes, pitch){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const ringDuration = 2.6;
    const gap = 1.0;
    const fundamental = pitch || 660;
    const partials = [1, 1.5, 2.0, 2.66, 3.4];
    const amps = [0.5, 0.32, 0.22, 0.14, 0.09];
    for(let s=0; s<strikes; s++){
      const startAt = now + s*gap;
      partials.forEach((mult, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.value = fundamental * mult;
        g.gain.value = 0.0001;
        o.start(startAt);
        g.gain.exponentialRampToValueAtTime(amps[i], startAt + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, startAt + ringDuration);
        o.stop(startAt + ringDuration + 0.05);
      });
    }
    setTimeout(()=> ctx.close(), (strikes*gap + ringDuration + 0.3)*1000);
  }catch(e){}
}
function playPresetChime(strikes, pitch){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const gap = 1.0;
    const playNote = (startAt, freq, amp, decay) => {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.value = 0.0001; o.start(startAt);
      g.gain.exponentialRampToValueAtTime(amp, startAt+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, startAt+decay);
      o.stop(startAt+decay+0.05);
    };
    for(let s=0; s<strikes; s++){
      const startAt = now + s*gap;
      const f1 = pitch || 660;
      playNote(startAt, f1, 0.4, 0.9);
      playNote(startAt+0.28, f1*0.75, 0.32, 1.1);
    }
    setTimeout(()=> ctx.close(), (strikes*gap+1.6)*1000);
  }catch(e){}
}
function playPresetWhistle(strikes, pitch){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const gap = 0.9;
    for(let s=0; s<strikes; s++){
      const startAt = now + s*gap;
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      const base = pitch ? pitch*1.6 : 1400;
      o.frequency.setValueAtTime(base*0.7, startAt);
      o.frequency.linearRampToValueAtTime(base, startAt+0.15);
      g.gain.value = 0.0001; o.start(startAt);
      g.gain.exponentialRampToValueAtTime(0.32, startAt+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, startAt+0.55);
      o.stop(startAt+0.6);
    }
    setTimeout(()=> ctx.close(), (strikes*gap+0.8)*1000);
  }catch(e){}
}
function playPresetMarimba(strikes, pitch){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const gap = 0.9;
    const base = pitch || 660;
    for(let s=0; s<strikes; s++){
      const startAt = now + s*gap;
      [0, 0.14, 0.28].forEach((offset, i) => {
        const freq = base * [1, 1.25, 1.5][i];
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'triangle'; o.frequency.value = freq;
        g.gain.value = 0.0001; o.start(startAt+offset);
        g.gain.exponentialRampToValueAtTime(0.3, startAt+offset+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, startAt+offset+0.35);
        o.stop(startAt+offset+0.4);
      });
    }
    setTimeout(()=> ctx.close(), (strikes*gap+1)*1000);
  }catch(e){}
}
function playPresetClassic(strikes, pitch){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const gap = 0.5;
    const base = pitch || 800;
    for(let s=0; s<strikes; s++){
      const startAt = now + s*gap;
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'square'; o.frequency.value = base;
      g.gain.value = 0.0001; o.start(startAt);
      g.gain.exponentialRampToValueAtTime(0.3, startAt+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, startAt+0.22);
      o.stop(startAt+0.25);
    }
    setTimeout(()=> ctx.close(), (strikes*gap+0.4)*1000);
  }catch(e){}
}
const SOUND_PRESETS = { bell: boxingBell, chime: playPresetChime, whistle: playPresetWhistle, marimba: playPresetMarimba, classic: playPresetClassic };

function currentTabataExerciseName(){
  const c = tabataState.circuit.length ? tabataState.circuit : [tabataState.label];
  return c[(tabataState.round - 1) % c.length];
}
function nextTabataExerciseName(){
  const c = tabataState.circuit.length ? tabataState.circuit : [tabataState.label];
  return c[tabataState.round % c.length];
}
function startTabataSession(exId){
  const ex = activeExercises().find(e => e.id === exId);
  if(!ex || ex.type !== 'tabata') return;
  clearInterval(tabataInterval);
  const circuit = (ex.tabataCircuit && ex.tabataCircuit.length) ? ex.tabataCircuit : [ex.name];
  const prep = ex.tabataPrep || 10;
  tabataState = {
    active:true, blockId: ex.id, circuit,
    work: ex.tabataWork || 20, rest: ex.tabataRest || 10, rounds: ex.tabataRounds || 8, prep,
    phase:'prep', round:1, running:true, label: ex.name || 'Tabata',
    endTime: Date.now() + prep*1000, lastCountdownAt:null,
    totalSeconds: calcTabataTotalSeconds(ex), sessionStartAt: Date.now(), pausedAccum:0, pauseStartedAt:null
  };
  const overlay = document.getElementById('tabataOverlay');
  if(overlay) overlay.classList.add('show');
  updateTabataUI();
  tabataInterval = setInterval(tickTabata, 250);
  requestNotifPermission();
}
function tickTabata(){
  if(!tabataState.running) return;
  const remaining = Math.max(0, Math.round((tabataState.endTime - Date.now())/1000));
  if(remaining <= 0){
    advanceTabataPhase();
    return;
  }
  if(remaining <= 3 && remaining !== tabataState.lastCountdownAt){
    tabataState.lastCountdownAt = remaining;
    tabataCountdownBeep();
  }
  updateTabataUI(remaining);
}
function advanceTabataPhase(){
  tabataState.lastCountdownAt = null;
  if(tabataState.phase === 'prep'){
    tabataState.phase = 'work';
    tabataState.endTime = Date.now() + tabataState.work*1000;
    tabataBeep('work');
  } else if(tabataState.phase === 'work'){
    if(tabataState.round >= tabataState.rounds){
      finishTabata();
      return;
    }
    tabataState.phase = 'rest';
    tabataState.endTime = Date.now() + tabataState.rest*1000;
    tabataBeep('rest');
  } else if(tabataState.phase === 'rest'){
    tabataState.round += 1;
    tabataState.phase = 'work';
    tabataState.endTime = Date.now() + tabataState.work*1000;
    tabataBeep('work');
  }
  updateTabataUI();
}
async function finishTabata(){
  tabataState.phase = 'done';
  tabataState.running = false;
  clearInterval(tabataInterval);
  updateTabataUI(0);
  beep();
  if(navigator.vibrate) navigator.vibrate([300,150,300,150,300,150,500]);
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification('MITFIT · Tabata terminado', { body: '¡' + tabataState.label + ' completado!', tag:'mitfit-tabata' });
    }
  }catch(e){}
  if(state.currentData){
    state.currentData.trainerNotes = state.currentData.trainerNotes || [];
    state.currentData.trainerNotes.unshift({
      id: uid(), date: todayISO(), routineName: tabataState.label,
      text: 'Completó el bloque Tabata "' + tabataState.label + '": ' + tabataState.rounds + ' rondas de ' + tabataState.work + 's trabajo / ' + tabataState.rest + 's descanso, en ' + (formatDuration(tabataState.totalSeconds) || '0:00') + ' totales.'
    });
    await saveStudent(state.currentId, state.currentData);
  }
  setTimeout(closeTabata, 3500);
}
function tabataBeep(kind){
  if(kind === 'work'){
    playAlertSound(2, 880);
  } else {
    playAlertSound(1, 520);
  }
  if(navigator.vibrate) navigator.vibrate(kind === 'work' ? [180] : [80,80,80]);
}
function tabataCountdownBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'square';
    o.frequency.value = 1000;
    g.gain.value = 0.001;
    const now = ctx.currentTime;
    o.start(now);
    g.gain.exponentialRampToValueAtTime(0.35, now + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    o.stop(now + 0.16);
    setTimeout(()=> ctx.close(), 400);
  }catch(e){}

function updateTabataUI(remainingOverride){

  if(exEl){

      exEl.textContent = tabataState.label;

      exEl.textContent = 'Primero: ' + currentTabataExerciseName();

      exEl.textContent = 'Ahora: ' + currentTabataExerciseName();

  }

  const totalEl = document.getElementById('tabataTotalTime');

    const elapsedMs = Date.now() - tabataState.sessionStartAt - tabataState.pausedAccum - (tabataState.pauseStartedAt ? (Date.now()-tabataState.pauseStartedAt) : 0);
    const elapsed = Math.max(0, Math.round(elapsedMs/1000));
    totalEl.textContent = 'Total: ' + (formatDuration(elapsed) || '0:00') + ' / ' + (formatDuration(tabataState.totalSeconds) || '0:00');

function toggleTabataPause(){
  if(tabataState.phase === 'done') return;
  tabataState.running = !tabataState.running;
  if(tabataState.running){
    const remaining = Math.max(0, Math.round((tabataState.endTime - Date.now())/1000)) || 1;

function skipTabataPhase(){

}
function confirmCloseTabata(){

let amrapInterval = null;
let amrapState = { active:false, minutes:0, prep:10, exercises:[], phase:'prep', rounds:0, endTime:0, running:false, lastCountdownAt:null, roundTimes:[], lastMarkAt:0 };

function mountAmrapOverlay(){
  if(document.getElementById('amrapOverlay')) return;
  const overlay = document.createElement('div');
  overlay.id = 'amrapOverlay';
  overlay.className = 'tabata-overlay';
  overlay.innerHTML = `
    <img class="tabata-bg-logo" src="${LOGO_HERO}" alt="" />
    <button class="tabata-close" onclick="confirmCloseAmrap()">✕</button>
    <div id="amrapPhase" class="tabata-phase prep">Preparate</div>
    <div id="amrapTime" class="tabata-time prep">00:00</div>
    <div id="amrapRounds" class="tabata-exname">0 rondas completas</div>
    <div id="amrapCircuit" class="tabata-round" style="max-width:300px; line-height:1.5;"></div>
    <div id="amrapSplits" class="mono" style="font-size:12px; color:var(--text-dim); margin-bottom:14px; max-width:300px;"></div>
    <div class="tabata-controls">
      <button id="amrapPauseBtn" onclick="toggleAmrapPause()">⏸ Pausar</button>
      <button onclick="incrementAmrapRound()">✅ +1 ronda</button>
    </div>
  `;
  document.body.appendChild(overlay);

mountAmrapOverlay();

function startAmrapSession(){
  const plan = state.amrapPlan;
  if(!plan || !plan.exercises || !plan.exercises.length){ showToast('Tu profe todavía no armó el Plan B'); return; }
  clearInterval(amrapInterval);
  const prep = plan.prep || 10;
  amrapState = {
    active:true, minutes: plan.minutes || 12, prep, exercises: plan.exercises,
    phase:'prep', rounds:0, running:true, endTime: Date.now() + prep*1000, lastCountdownAt:null,
    roundTimes:[], lastMarkAt:0
  };
  const overlay = document.getElementById('amrapOverlay');
  if(overlay) overlay.classList.add('show');
  updateAmrapUI();
  amrapInterval = setInterval(tickAmrap, 250);
  requestNotifPermission();
}
function tickAmrap(){
  if(!amrapState.running) return;
  const remaining = Math.max(0, Math.round((amrapState.endTime - Date.now())/1000));
  if(remaining <= 0){
    advanceAmrapPhase();
    return;
  }
  if(remaining <= 3 && remaining !== amrapState.lastCountdownAt){
    amrapState.lastCountdownAt = remaining;
    tabataCountdownBeep();
  }
  updateAmrapUI(remaining);
}
function advanceAmrapPhase(){
  amrapState.lastCountdownAt = null;
  if(amrapState.phase === 'prep'){
    amrapState.phase = 'go';
    amrapState.endTime = Date.now() + amrapState.minutes*60*1000;
    amrapState.lastMarkAt = Date.now();
    playAlertSound(2, 880);
    updateAmrapUI();
  } else {
    finishAmrap();
  }
}
async function finishAmrap(){
  amrapState.phase = 'done';
  amrapState.running = false;
  clearInterval(amrapInterval);
  updateAmrapUI(0);
  playAlertSound(3, 700);
  if(navigator.vibrate) navigator.vibrate([300,150,300,150,300,150,500]);
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification('MITFIT · Plan B terminado', { body: 'Completó ' + amrapState.rounds + ' rondas', tag:'mitfit-amrap' });
    }
  }catch(e){}
  state.currentData.trainerNotes = state.currentData.trainerNotes || [];
  const splitsText = amrapState.roundTimes.length
    ? ' Rondas: ' + amrapState.roundTimes.map((t,i)=> 'R'+(i+1)+' '+formatDuration(t)).join(', ') + '.'
    : '';
  state.currentData.trainerNotes.unshift({
    id: uid(), date: todayISO(), routineName: 'Plan B (AMRAP)',
    text: 'Hizo el Plan B en lugar de la rutina de hoy: ' + amrapState.rounds + ' rondas en ' + amrapState.minutes + ' min.' + splitsText
  });
  await saveStudent(state.currentId, state.currentData);
  setTimeout(closeAmrap, 3500);
}
function incrementAmrapRound(){
  if(amrapState.phase !== 'go') return;
  const now = Date.now();
  const splitSeconds = Math.max(1, Math.round((now - amrapState.lastMarkAt)/1000));
  amrapState.roundTimes.push(splitSeconds);
  amrapState.lastMarkAt = now;
  amrapState.rounds += 1;
  updateAmrapUI();
}
function updateAmrapUI(remainingOverride){
  const remaining = (remainingOverride !== undefined) ? remainingOverride : Math.max(0, Math.round((amrapState.endTime - Date.now())/1000));
  const mm = String(Math.floor(remaining/60)).padStart(2,'0');
  const ss = String(remaining%60).padStart(2,'0');
  const phaseKey = amrapState.phase === 'go' ? 'work' : amrapState.phase;
  const timeEl = document.getElementById('amrapTime');
  if(timeEl){ timeEl.textContent = mm+':'+ss; timeEl.className = 'tabata-time ' + phaseKey; }
  const phaseEl = document.getElementById('amrapPhase');
  if(phaseEl){
    phaseEl.className = 'tabata-phase ' + phaseKey;
    phaseEl.textContent = amrapState.phase === 'prep' ? 'Preparate' : amrapState.phase === 'go' ? 'AMRAP en marcha' : '¡Listo!';
  }
  const roundsEl = document.getElementById('amrapRounds');
  if(roundsEl) roundsEl.textContent = amrapState.phase === 'done'
    ? ('¡' + amrapState.rounds + ' ronda' + (amrapState.rounds===1?'':'s') + ' completadas!')
    : (amrapState.rounds + ' ronda' + (amrapState.rounds===1?'':'s') + ' completas');
  const circuitEl = document.getElementById('amrapCircuit');
  if(circuitEl) circuitEl.textContent = amrapState.exercises.join(' · ');
  const splitsEl = document.getElementById('amrapSplits');
  if(splitsEl){
    if(amrapState.roundTimes.length){
      const fastest = Math.min(...amrapState.roundTimes);
      splitsEl.innerHTML = amrapState.roundTimes.map((t, i) =>
        `<span style="${t===fastest?'color:var(--accent); font-weight:700;':''}">R${i+1}: ${formatDuration(t) || '0:0'+t}</span>`
      ).join(' &nbsp;·&nbsp; ');
    } else {
      splitsEl.textContent = '';
    }
  }
  const pauseBtn = document.getElementById('amrapPauseBtn');
  if(pauseBtn) pauseBtn.textContent = amrapState.running ? '⏸ Pausar' : '▶ Seguir';
}
function toggleAmrapPause(){
  if(amrapState.phase === 'done') return;
  amrapState.running = !amrapState.running;
  if(amrapState.running){
    const remaining = Math.max(0, Math.round((amrapState.endTime - Date.now())/1000)) || 1;
    amrapState.endTime = Date.now() + remaining*1000;
    amrapInterval = setInterval(tickAmrap, 250);
  } else {
    clearInterval(amrapInterval);
  }
  updateAmrapUI();
}
function confirmCloseAmrap(){
  if(amrapState.phase === 'done'){ closeAmrap(); return; }
  showConfirmDialog('¿Salir del Plan B? Se va a perder el progreso de esta sesión.', closeAmrap);
}
function closeAmrap(){
  clearInterval(amrapInterval);
  amrapState = { active:false, minutes:0, prep:10, exercises:[], phase:'prep', rounds:0, endTime:0, running:false, lastCountdownAt:null };
  const overlay = document.getElementById('amrapOverlay');
  if(overlay) overlay.classList.remove('show');
}
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && amrapState.active && amrapState.running){
    tickAmrap();
  }
});

/* ---------- Session clock (cronómetro de rutina) ---------- */
let workoutClockInterval = null;
let workoutClockState = { running:false, startTs:0, elapsedBase:0, label:'' };

function mountSessionClockBar(){
  if(document.getElementById('sessionClockBar')) return;
  const bar = document.createElement('div');
  bar.id = 'sessionClockBar';
  bar.className = 'session-clock-bar';
  bar.innerHTML = `
    <span class="session-clock-dot"></span>
    <span class="session-clock-label" id="sessionClockLabel">Rutina</span>
    <span class="session-clock-time" id="sessionClockTime">00:00</span>
    <button class="session-clock-cancel" onclick="cancelWorkoutClock()" title="Cancelar cronómetro">✕</button>
  `;
  document.body.appendChild(bar);
}
mountSessionClockBar();

function isWorkoutClockActive(){ return workoutClockState.running; }
function getWorkoutElapsedSeconds(){
  if(!workoutClockState.running) return Math.floor(workoutClockState.elapsedBase / 1000);
  return Math.floor((workoutClockState.elapsedBase + (Date.now() - workoutClockState.startTs)) / 1000);
}
function updateWorkoutClockUI(){
  const secs = getWorkoutElapsedSeconds();
  const mm = String(Math.floor(secs / 60)).padStart(2, '0');
  const ss = String(secs % 60).padStart(2, '0');
  const timeEl = document.getElementById('sessionClockTime');
  if(timeEl) timeEl.textContent = mm + ':' + ss;
}
function startWorkoutClock(label){
  clearInterval(workoutClockInterval);
  workoutClockState = { running:true, startTs: Date.now(), elapsedBase:0, label: label || 'Rutina de hoy' };
  const bar = document.getElementById('sessionClockBar');
  if(bar) bar.classList.add('show');
  const labelEl = document.getElementById('sessionClockLabel');
  if(labelEl) labelEl.textContent = workoutClockState.label;
  updateWorkoutClockUI();
  workoutClockInterval = setInterval(updateWorkoutClockUI, 1000);
  render();
}
function stopWorkoutClock(){
  const secs = getWorkoutElapsedSeconds();
  clearInterval(workoutClockInterval);
  workoutClockState = { running:false, startTs:0, elapsedBase:0, label:'' };
  const bar = document.getElementById('sessionClockBar');
  if(bar) bar.classList.remove('show');
  return secs;
}
function cancelWorkoutClock(){
  stopWorkoutClock();
  showToast('Cronómetro cancelado');
  render();
}
function formatDuration(totalSeconds){
  if(!totalSeconds) return null;
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  if(h > 0) return `${h}h ${String(m).padStart(2,'0')}m`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function requestStudentAccess(id){
  const entry = state.studentsIndex.find(s => s.id === id);

  pinTargetId = id;
  state.formOpen = 'enterPin';
  render();

  pinTargetId = null;
  state.formOpen = null;
  render();
}
function submitPinEntry(ev){
  ev.preventDefault();
  const input = document.getElementById('pinInput');
  const val = input ? input.value.trim() : '';
  const entry = state.studentsIndex.find(s => s.id === pinTargetId);
  if(entry && val && val === entry.pin){

    pinTargetId = null;
    state.formOpen = null;
    openStudentPortal(id);
  } else {
    showToast('PIN incorrecto');
    if(input){ input.value = ''; input.focus(); }

async function submitNewRoutine(ev){
  ev.preventDefault();
  const input = document.getElementById('newRoutineName');
  const weeksInput = document.getElementById('newRoutineWeeks');
  const name = (input.value.trim()) || 'Rutina sin nombre';
  const durationWeeks = parseInt(weeksInput?.value) || 0;
  const routine = { id: uid(), name, exercises: [], startDate: todayISO(), durationWeeks };
  state.currentData.routines.push(routine);
  await saveStudent(state.currentId, state.currentData);
  state.formOpen = null;
  openRoutine(routine.id);
}
async function deleteRoutine(routineId){
  showConfirmDialog('¿Eliminar esta rutina completa?', async () => {
    state.currentData.routines = state.currentData.routines.filter(r => r.id !== routineId);
    await saveStudent(state.currentId, state.currentData);
    render();
  });
}
async function renameRoutine(routineId, ev){
  const val = ev.target.value.trim();
  const r = state.currentData.routines.find(x => x.id === routineId);
  if(!r) return;
  r.name = val || r.name;
  await saveStudent(state.currentId, state.currentData);
}
async function setRoutineDuration(routineId, weeks){
  const r = state.currentData.routines.find(x => x.id === routineId);
  if(!r) return;
  r.durationWeeks = weeks;
  if(!r.startDate) r.startDate = todayISO();
  await saveStudent(state.currentId, state.currentData);
  render();
}
function cycleInfo(routine){
  if(!routine.durationWeeks || !routine.startDate) return null;
  const start = new Date(routine.startDate + 'T00:00:00');
  const end = new Date(start.getTime() + routine.durationWeeks * 7 * 24*60*60*1000);
  const now = new Date();
  const daysLeft = Math.ceil((end - now) / (24*60*60*1000));
  return { endDate: end, daysLeft, ended: daysLeft < 0 };
}
function cycleBadgeHtml(routine){
  const info = cycleInfo(routine);
  if(!info) return '';
  if(info.ended){
    return `<div class="mono" style="font-size:11px; color:var(--danger); margin-top:5px; font-weight:700;">⏰ Ciclo terminado hace ${Math.abs(info.daysLeft)} día${Math.abs(info.daysLeft)===1?'':'s'} — hora de renovar</div>`;
  }
  if(info.daysLeft <= 7){
    return `<div class="mono" style="font-size:11px; color:var(--yellow); margin-top:5px; font-weight:700;">⏰ Termina en ${info.daysLeft} día${info.daysLeft===1?'':'s'}</div>`;
  }
  return `<div class="mono" style="font-size:11px; color:var(--text-dim); margin-top:5px;">⏰ Ciclo: ${info.daysLeft} días restantes</div>`;
}
function googleCalendarLink(title, dateObj, details){
  const fmt = d => d.toISOString().slice(0,10).replace(/-/g,'');
  const end = new Date(dateObj.getTime() + 24*60*60*1000);
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(title)
    + '&dates=' + fmt(dateObj) + '/' + fmt(end)
    + '&details=' + encodeURIComponent(details || '');
  return url;
}

function getTodayLogEntry(d, exId){
  const today = todayISO();
  const todaysLogs = (d.logs || []).filter(l => l.date === today);
  for(const log of todaysLogs){
    const entry = log.entries.find(e => e.exerciseId === exId);
    if(entry) return entry;
  }
  return null;
}
function computeTodaySessionSummary(d, r){
  const today = todayISO();
  const log = (d.logs || []).find(l => l.date === today && l.routineId === r.id);
  const routine = (r.exercises || []).filter(e => !e.warmup && e.type !== 'tabata');
  if(!log) return { hasLog:false, doneCount:0, total:routine.length };
  let doneCount = 0;
  routine.forEach(ex => {
    const entry = log.entries.find(e => e.exerciseId === ex.id);
    if(entry && entry.sets.length >= ex.sets) doneCount++;
  });
  return { hasLog:true, doneCount, total: routine.length };
}

function trainerExRowHtml(ex, d){
  const entry = d ? getTodayLogEntry(d, ex.id) : null;

    ? `<span class="mono" style="font-size:10px; color:${isComplete ? 'var(--green)' : 'var(--yellow)'};">${isComplete ? '✓ ' : ''}Hoy: ${doneCount}/${ex.sets}</span>`

  return `
    <div class="ex-row">
      <div class="ex-head">
        <div style="display:flex; gap:12px;">

function calcTabataTotalSeconds(ex){
  const work = ex.tabataWork || 20;
  const rest = ex.tabataRest || 10;
  const rounds = ex.tabataRounds || 8;
  const prep = ex.tabataPrep || 10;
  return prep + work*rounds + rest*Math.max(0, rounds-1);
}

  const circuitLabel = (ex.tabataCircuit && ex.tabataCircuit.length) ? ex.tabataCircuit.join(' → ') : ex.name;

function computeExerciseSeries(d, exId){
  const exDef = allExercisesFlat(d).find(e => e.id === exId);
  const isTime = exDef && exDef.type === 'time';
  const points = [];
  (d.logs||[]).forEach(log => {
    const entry = log.entries.find(e => e.exerciseId === exId);
    if(entry){
      const top = isTime
        ? entry.sets.reduce((sum, s) => sum + (s.reps || 0), 0)
        : Math.max(...entry.sets.map(s => s.weight || 0));
      points.push({ date: log.date, top });
    }
  });
  points.sort((a,b)=> a.date.localeCompare(b.date));
  return { points, unit: isTime ? 'min' : 'kg' };
}

function sparklineSvg(points, unit){
  unit = unit || 'kg';
  if(points.length < 1) return `<div class="chart-empty">Sin sesiones registradas todavía.</div>`;
  const w = 280, h = 70, pad = 10;
  const vals = points.map(p=>p.top);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const stepX = points.length > 1 ? (w - pad*2) / (points.length - 1) : 0;
  const coords = points.map((p,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((p.top - min)/range) * (h - pad*2);
    return {x, y, val:p.top};
  });
  const path = coords.map((c,i)=> (i===0?'M':'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="#22e07a" stroke="#0a0d0a" stroke-width="1.5"/>`).join('');
  return `
    <svg class="chart" viewBox="0 0 ${w} ${h}">
      <path d="${path}" fill="none" stroke="#22e07a" stroke-width="2" />
      ${dots}
    </svg>
    <div style="display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:2px;">
      <span>${formatDate(points[0].date)} · ${unit==='min'?formatMinDuration(points[0].top):points[0].top+unit}</span>
      <span>${formatDate(points[points.length-1].date)} · ${unit==='min'?formatMinDuration(points[points.length-1].top):points[points.length-1].top+unit}</span>
    </div>
  `;
}

function computeSessionVolume(log, d){
  const exercises = d ? allExercisesFlat(d) : [];
  return log.entries.reduce((sum, e) => {
    const exDef = exercises.find(r => r.id === e.exerciseId);
    if(exDef && exDef.type === 'time') return sum;
    return sum + e.sets.reduce((s2, st) => s2 + ((st.reps||0) * (st.weight||0)), 0);
  }, 0);
}

function computeVolumeSeries(d){
  const logs = [...(d.logs || [])].sort((a,b) => a.date.localeCompare(b.date));
  return logs.map(log => ({ date: log.date, volume: computeSessionVolume(log, d) }));
}

function volumeWaveSvg(points){
  if(points.length < 1) return `<div class="chart-empty">Sin sesiones registradas todavía.</div>`;
  if(points.length < 2) return `<div class="chart-empty">Necesitas al menos 2 sesiones para ver la curva de volumen.</div>`;
  const w = 300, h = 110, pad = 14;
  const vals = points.map(p => p.volume);
  const max = Math.max(...vals) || 1;
  const stepX = (w - pad*2) / (points.length - 1);
  const coords = points.map((p,i) => {
    const x = pad + i*stepX;
    const y = h - pad - (p.volume / max) * (h - pad*2);
    return { x, y };
  });

  let line = `M ${coords[0].x.toFixed(1)},${coords[0].y.toFixed(1)}`;
  for(let i=0;i<coords.length-1;i++){
    const c0 = coords[i], c1 = coords[i+1];
    const midX = (c0.x + c1.x) / 2, midY = (c0.y + c1.y) / 2;
    line += ` Q ${c0.x.toFixed(1)},${c0.y.toFixed(1)} ${midX.toFixed(1)},${midY.toFixed(1)}`;
  }
  const last = coords[coords.length-1];
  line += ` T ${last.x.toFixed(1)},${last.y.toFixed(1)}`;
  const areaPath = `${line} L ${last.x.toFixed(1)},${(h-pad).toFixed(1)} L ${coords[0].x.toFixed(1)},${(h-pad).toFixed(1)} Z`;
  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.5" fill="#eef3ee" stroke="#22e07a" stroke-width="1.5"/>`).join('');
  const gradId = 'waveGrad' + Math.random().toString(36).slice(2,8);

  return `
    <svg class="chart" viewBox="0 0 ${w} ${h}">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#22e07a" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#22e07a" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#${gradId})" stroke="none"/>
      <path d="${line}" fill="none" stroke="#22e07a" stroke-width="2.2"/>
      ${dots}
    </svg>
    <div style="display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:2px;">
      <span>${formatDate(points[0].date)}</span>
      <span style="color:var(--green);">máx ${max.toLocaleString('es-AR')} kg</span>
      <span>${formatDate(points[points.length-1].date)}</span>
    </div>
  `;
}

        const isTime = exDef && exDef.type === 'time';
        const detail = isTime
          ? e.sets.map(s => formatMinDuration(s.reps) + (s.weight ? ' (nivel ' + s.weight + ')' : '')).join(', ')
          : e.sets.map(s => s.reps + '×' + s.weight + 'kg').join(', ');
        return `<div class="line">${escapeHtml(e.exerciseName)} <span>— ${detail}</span></div>`;
      }).join('')}
      ${log.photo ? `<img src="${escapeHtml(log.photo)}" style="width:100%; max-width:220px; border-radius:10px; margin-top:8px; display:block; border:1px solid var(--line);" />` : ''}
    </div>
  `;
  }).join('');

  return `
    ${notesHtml}
    ${volumeSeries.length ? `
      <div class="section-title">Volumen por sesión</div>
      <div class="chart-card" style="margin-bottom:12px;">
        <h4>Kg totales levantados, sesión a sesión</h4>
        ${volumeWaveSvg(volumeSeries.map(v => ({ date: v.date, volume: v.volume })))}
      </div>
    ` : ''}
    ${exercises.length ? `<div class="section-title">Progreso por ejercicio</div>${charts}` : ''}
    <div class="section-title">Historial de sesiones</div>
    ${sortedLogs.length ? sessions : `<div class="empty" style="padding:20px 8px;"><p>Todavía no hay sesiones registradas.</p></div>`}
  `;
}

function startRoutine(routineId){
  state.currentRoutineId = routineId;
  render();
}
function backToStudentRoutines(){
  state.currentRoutineId = null;
  render();
}
function renderStudentRoutineTabWrapper(d){
  const activeRoutine = getActiveRoutine();
  const amrapButtonHtml = (state.amrapPlan && state.amrapPlan.exercises && state.amrapPlan.exercises.length) ? `
    <button class="btn" style="margin-bottom:18px; width:100%; background:rgba(244,167,0,0.14); border:1.5px solid var(--yellow); color:var(--yellow); font-weight:700;" onclick="startAmrapSession()">🅱️ Hoy prefiero el Plan B (${state.amrapPlan.minutes} min AMRAP)</button>
  ` : '';
  if(!activeRoutine){
    const routines = d.routines || [];
    const cards = routines.map(r => routineCardHtml(r, 'student')).join('');
    return `
      ${amrapButtonHtml}
      <div class="section-title">${escapeHtml(d.name)} (${routines.length})</div>
      ${routines.length ? cards : `<div class="empty" style="padding:20px 8px;"><p>Tu entrenador todavía no armó ninguna rutina para vos.</p></div>`}
    `;
  }
  return `
    <button class="backlink" style="margin-bottom:12px; padding:0;" onclick="backToStudentRoutines()">‹ Cambiar rutina</button>
    <div class="section-title" style="margin-top:0;">${escapeHtml(activeRoutine.name)}</div>
    ${cycleBadgeHtml(activeRoutine) ? `<div style="margin:-6px 0 14px;">${cycleBadgeHtml(activeRoutine)}</div>` : ''}
    ${renderStudentRoutineTab(d)}
  `;
}

function renderStudentPortal(){
  const d = state.currentData;
  if(!d){
    app.innerHTML = `${topbar(true, 'Cambiar de alumno', 'goPickStudent()')}<div class="content"><p class="chart-empty">Cargando…</p></div>`;
    return;
  }
  const indexEntry = state.studentsIndex.find(s=>s.id===state.currentId);
  const tab = state.studentTab === 'progreso' ? 'progreso' : 'rutina';

  app.innerHTML = `
    ${topbar(true, 'Cambiar de alumno', 'goPickStudent()')}
    <div class="content with-bottom-nav">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:6px;">
        ${avatarHtml({...indexEntry, name: d.name}, 48, 18)}
        <div>
          <h2 style="font-size:20px;">${escapeHtml(d.name)}</h2>
          <div class="mono" style="font-size:12px; color:var(--text-dim);">${formatDate(todayISO())}</div>
        </div>
      </div>

      ${tab === 'rutina' ? renderStudentRoutineTabWrapper(d) : renderProgressView(d, false)}
    </div>
    <div class="bottom-nav">
      <button class="bottom-nav-item" onclick="goHome()">
        <span class="bottom-nav-icon">🏠</span>
        Inicio
      </button>
      <button class="bottom-nav-item ${tab==='rutina'?'active':''}" onclick="setStudentTab('rutina')">
        <span class="bottom-nav-icon">🏋️</span>
        Entrenamiento
      </button>
      <button class="bottom-nav-item ${tab==='progreso'?'active':''}" onclick="setStudentTab('progreso')">
        <span class="bottom-nav-icon">👤</span>
        Perfil
      </button>
    </div>
  `;
}

function studentExRowHtml(ex){
  const draft = getTodaysDraft();
  const setsDone = draft[ex.id] || [];
  const doneCount = setsDone.filter(Boolean).length;
  const exerciseComplete = doneCount >= ex.sets && ex.sets > 0;
  const isTime = ex.type === 'time';
    const slots = Array.from({length: ex.sets}).map((_, i) => {
      const s = setsDone[i];
      const key = 'logSet:' + ex.id + ':' + i;
      if(state.formOpen === key){
        const msplit = splitMinSec(ex.reps);
        return `
          <form class="inline-form" style="margin:10px 0; width:100%;">
            <div class="field-row">
              ${isTime ? `
                <div class="field" style="flex:1;">
                  <label>Min : Seg</label>
                  <div style="display:flex; gap:6px;">
                    <input id="slotRepsMin" type="number" min="0" placeholder="Min" style="width:50%;" value="${msplit.min}" />
                    <input id="slotRepsSec" type="number" min="0" max="59" placeholder="Seg" style="width:50%;" value="${msplit.sec}" />
                  </div>
                </div>
              ` : `
                <div class="field"><label>Reps</label><input id="slotReps" type="number" min="1" value="${ex.reps}" /></div>
              `}
              <div class="field"><label>${isTime ? 'Nivel (opcional)' : 'Kg'}</label><input id="slotWeight" type="number" min="0" step="0.5" value="${ex.weight}" /></div>
            </div>
            <div class="row-gap">
              <button type="button" class="btn btn-primary btn-sm" onclick="submitLogSlot(event,'${ex.id}',${i})">${isTime ? 'Cargar bloque' : 'Cargar serie'}</button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="state.formOpen=null; render();">Cancelar</button>
            </div>
          </form>
        `;
      }
      if(s){
        const cc = PLATE_COLORS[2];
        const label = isTime ? formatMinDuration(s.reps) : `${s.reps}×${s.weight}`;
        return `<div class="slot filled" style="background:${cc.bg}; border-color:${cc.border}; color:#1c1c1e;" onclick="openLogSlot('${ex.id}',${i})"><span class="slot-check">✓</span>${label}</div>`;
      }
      return `<div class="slot" onclick="openLogSlot('${ex.id}',${i})">${i+1}</div>`;
    }).join('<div class="bar-line"></div>');

  const anyForm = Array.from({length: ex.sets}).some((_,i)=> state.formOpen === ('logSet:'+ex.id+':'+i));

  return `
    <div class="ex-row" style="margin-bottom:12px;">
      <div class="ex-head">
        <div style="display:flex; gap:12px;">
          ${ex.photo ? `<img class="ex-photo" src="${ex.photo}" />` : `<div class="ex-photo-placeholder">🏋️</div>`}
          <div>
            <h4>${escapeHtml(ex.name)}${exerciseComplete ? '<span class="ex-complete-badge">✓</span>' : ''}</h4>
            <div class="meta">${ex.type==='time' ? `objetivo: ${ex.sets} × ${formatMinDuration(ex.reps)}${ex.weight?' · nivel '+ex.weight:''}` : `objetivo: ${ex.sets} × ${ex.reps} reps · ${ex.weight} kg`}</div>
            <a href="${ex.video ? escapeHtml(ex.video) : youtubeSearchUrl(ex.name)}" target="_blank" rel="noopener" class="mono" style="display:inline-block; margin-top:4px; font-size:11px; color:var(--accent); text-decoration:none;">${ex.video ? '▶ Ver video' : '🔍 Buscar video'}</a>
          </div>
        </div>
        <button class="icon-btn" title="Iniciar descanso" onclick="startRestTimer(${ex.restSeconds||90}, '${escapeHtml(ex.name).replace(/'/g,"\\'")}')">⏱</button>
      </div>
      ${!anyForm ? `<div class="bar-loader">${slots}</div>` : `<div>${slots}</div>`}
    </div>
  `;
}

function studentTabataRowHtml(ex){
  const circuitLabel = (ex.tabataCircuit && ex.tabataCircuit.length) ? ex.tabataCircuit.join(' → ') : ex.name;
  return `
    <div class="ex-row" style="margin-bottom:12px;">
      <div class="ex-head">
        <div style="display:flex; gap:12px;">
          <div class="ex-photo-placeholder">⏱️</div>
          <div>
            <h4>${escapeHtml(ex.name)}</h4>
            <div class="meta">TABATA · ${ex.tabataRounds||8} rondas · ${ex.tabataWork||20}s / ${ex.tabataRest||10}s · Total: ${formatDuration(calcTabataTotalSeconds(ex))}</div>
            <div class="meta" style="margin-top:2px;">${escapeHtml(circuitLabel)}</div>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" style="margin-top:10px; width:100%;" onclick="startTabataSession('${ex.id}')">▶ Iniciar Tabata</button>
    </div>
  `;
}

function renderStudentRoutineTab(d){
  const exercises = activeExercises();
  if(!exercises.length){
    return `<div class="empty"><p>Esta rutina todavía no tiene ejercicios.</p></div>`;
  }
  const warmupList = exercises.filter(e => e.warmup);
  const mainList = exercises.filter(e => !e.warmup);

  const rowsFor = (list) => buildGroupedBlocks(list).map(block => {
    if(block.group){
      const gc = groupColor(block.group);
      const inner = block.items.map(studentExRowHtml).join('');
      return `
        <div class="superset-block" style="border-left-color:${gc.bg};">
          <div class="superset-badge" style="background:${gc.bg}; color:${gc.text==='light'?'#fff':'#1c1c1e'};">Superserie ${escapeHtml(block.group)} · sin descanso entre ejercicios</div>
          <div>${inner}</div>
        </div>
      `;
    }
    const item = block.items[0];
    return item.type === 'tabata' ? studentTabataRowHtml(item) : studentExRowHtml(item);
  }).join('');

  const warmupRows = rowsFor(warmupList);
  const mainRows = rowsFor(mainList);

  const draftPhoto = state.currentData.__draftPhoto || '';
  const clockActive = isWorkoutClockActive();
  const routineLabel = (getActiveRoutine() && getActiveRoutine().name) || 'Rutina de hoy';
  const activeRoutineForNotes = getActiveRoutine();
  const warmupNotes = activeRoutineForNotes ? (activeRoutineForNotes.warmupNotes || '') : '';
  return `
    <div class="field" style="margin-bottom:14px;">
      <label>🔊 Sonido de alertas</label>
      <div class="row-gap">
        <select id="soundPrefSelect" onchange="setSoundPref(this.value)" style="flex:1; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--text); font-family:var(--font-body); font-size:14px;">
          ${Object.keys(SOUND_PRESET_LABELS).map(k => `<option value="${k}" ${((d.soundPref||'bell')===k)?'selected':''}>${SOUND_PRESET_LABELS[k]}</option>`).join('')}
        </select>
        <button type="button" class="btn btn-secondary btn-sm" onclick="playAlertSound(2, 700)">▶ Probar</button>
      </div>
    </div>
    ${!clockActive ? `<button class="btn btn-secondary" style="margin-bottom:14px;" onclick="startWorkoutClock('${escapeHtml(routineLabel).replace(/'/g,"\\'")}')">▶ Comenzar rutina</button>` : `<div class="mono" style="font-size:11px; color:var(--accent); margin-bottom:14px;">● Cronómetro corriendo — mirá arriba de la pantalla</div>`}
    ${(state.amrapPlan && state.amrapPlan.exercises && state.amrapPlan.exercises.length) ? `
      <button class="btn" style="margin-bottom:20px; width:100%; background:rgba(244,167,0,0.14); border:1.5px solid var(--yellow); color:var(--yellow); font-weight:700;" onclick="startAmrapSession()">🅱️ Hoy prefiero el Plan B (${state.amrapPlan.minutes} min AMRAP)</button>
    ` : ''}
    ${(warmupList.length || warmupNotes) ? `
      <div class="section-title">🔥 Entrada en calor</div>
      ${warmupNotes ? `<div style="background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px; line-height:1.5; white-space:pre-wrap;">${escapeHtml(warmupNotes)}</div>` : ''}
      ${warmupList.length ? `<div style="margin-bottom:20px;">${warmupRows}</div>` : ''}
      <div class="section-title">Rutina</div>
    ` : ''}
    <div>${mainList.length ? mainRows : (warmupList.length ? `<div class="empty" style="padding:16px 8px;"><p>Sin ejercicios en la rutina principal todavía.</p></div>` : '')}</div>
    <div class="field" style="margin-top:14px;">
      <label>Foto de la sesión (opcional)</label>
      <input id="sessionPhotoUrl" type="url" inputmode="url" placeholder="Pega el link de una foto (selfie, check-in, etc.)" autocomplete="off" value="${escapeHtml(draftPhoto)}" oninput="handleSessionPhotoInput(event)" style="width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 10px; color:var(--text); font-family:var(--font-mono); font-size:11px;" />
      <img id="sessionPhotoPreview" style="display:${draftPhoto?'block':'none'}; max-width:140px; border-radius:10px; margin-top:8px; border:1px solid var(--line);" src="${escapeHtml(draftPhoto)}" />
    </div>
    <button class="btn btn-primary" style="margin-top:12px;" onclick="saveSession()">Guardar sesión</button>
    <div class="field" style="margin-top:26px;">
      <label>💬 ¿Querés contarle algo a tu profe sobre esta rutina?</label>
      <textarea id="studentNoteInput" placeholder="Ej. me costó la última serie de sentadillas, o quiero cambiar tal ejercicio por dolor en la rodilla..."></textarea>
    </div>
    <button class="btn btn-secondary" style="margin-top:10px; width:100%;" onclick="submitStudentNote()">Enviar mensaje</button>
  `;
}
</script>
</body>
</html>
